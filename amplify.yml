version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify injects console-managed variables at build time only; the Next SSR
        # compute function does not inherit them. Bake them into .env.production so
        # they exist at runtime.
        - env | grep -E '^RESEND_API_KEY=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
